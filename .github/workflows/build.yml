name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: Build with Buildozer
        run: |
          # Thiết lập biến môi trường để chấp nhận SDK License tự động
          mkdir -p .buildozer/android/platform/android-sdk-20/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5261c55" > .buildozer/android/platform/android-sdk-20/licenses/android-sdk-license
          
          # Chạy build
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Game-APK
          path: bin/*.apk
