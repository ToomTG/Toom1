name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-dev libffi-dev libssl-dev zlib1g-dev \
            autoconf libtool pkg-config libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libsqlite3-dev libbz2-dev libreadline-dev \
            liblzma-dev build-essential libncurses5-dev libncursesw5-dev \
            libtinfo5 openjdk-17-jdk unzip autoconf libtool pkg-config

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython
          # Đảm bảo có cả virtualenv vì buildozer cần nó
          pip install virtualenv

      - name: Build with Buildozer
        run: |
          # Dòng này cực kỳ quan trọng để bỏ qua các lỗi tương tác không cần thiết
          buildozer android debug
        env:
          # Ép buộc sử dụng Node 24 để không còn cảnh báo vàng
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
