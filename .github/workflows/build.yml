name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy mã nguồn về máy chủ GitHub
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Cài đặt Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      # 3. Cài đặt các thư viện hệ thống và Buildozer
      - name: Install Build system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade buildozer cython virtualenv

      # 4. Chạy Buildozer để tạo APK
      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug

      # 5. Tải file APK thu được lên GitHub
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToomTG-Android-App
          path: bin/*.apk
          retention-days: 5
